<nav class="navbar">
    <div class="navbar-container">

        <a href="{% url 'home' %}" class="navbar-brand">
            Портал групи
        </a>

        <div class="navbar-menu">

            <a href="/materials/" class="navbar-link">
                Навчальні матеріали
            </a>
            {% if user.is_authenticated %}

                {% if user.can_moderate %}
                    <a href="{% url 'materials:add' %}" class="navbar-link">
                        Додати матеріал
                    </a>

                    <a href="{% url 'materials:category_list' %}" class="navbar-link">
                        Категорії
                    </a>
                {% endif %}

                <span class="navbar-user">
                    {{ user.username }}
                </span>

                <form method="post" action="{% url 'logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="navbar-link">
                        Вийти
                    </button>
                </form>

            {% else %}

                <a href="{% url 'login' %}" class="navbar-link">
                    Увійти
                </a>

            {% endif %}

        </div>
    </div>
</nav>
