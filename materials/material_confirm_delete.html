{% extends "base.html" %}

{% block content %}

<h1>Видалення матеріалу</h1>

<p>
    Ви дійсно хочете видалити цей матеріал?
</p>

<p>
    <strong>Назва:</strong> {{ material.title }}
</p>

<p>
    <strong>Тип:</strong> {{ material.material_type }}
</p>

<p>
    <strong>Категорія:</strong> {{ material.category }}
</p>

<p>
    <strong>Увага!</strong> Після видалення матеріал буде втрачено.
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">
        Видалити
    </button>

    <a href="{{ material.get_absolute_url }}">
        Скасувати
    </a>
</form>

{% endblock %}
