{% extends 'core/base.html' %}

{% block content %}

<h2>Видалити оцінку</h2>

<p>
    Ви впевнені, що хочете видалити оцінку
    <strong>{{ object.value }}</strong>?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Видалити
    </button>

    <a href="{% url 'diary:student_grades' object.student.pk %}"
       class="btn btn-secondary">
        Скасувати
    </a>
</form>

{% endblock %}
