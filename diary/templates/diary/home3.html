{% extends "base.html" %}
{% block content %}
<h1>Welcome to the Diary Home Page</h1>
<p>This is a simple home page for the diary application.</p>
<div class="container" >
    <hr>
    <ul>
        <li class="list-group-item">{{ subject.title }}</li>
        <li class="list-group-item">{{ subject.description }}</li>
        <li class="list-group-item">{{ subject.is_active }}</li>
        <li class="list-group-item">{{ subject.created_at }}</li>
    </ul>
    <hr>
</div>
{% endblock %}
